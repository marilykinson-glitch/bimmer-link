plugins {
    id 'com.android.application'
}

android {
    namespace 'app.bimmerlink.mybmw'
    compileSdk 34

    defaultConfig {
        applicationId "app.bimmerlink.mybmw"
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName "0.5.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
}
