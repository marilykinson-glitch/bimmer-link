plugins {
    id 'com.android.application'
}

android {
    namespace 'app.bimmerlink.mybmw'
    compileSdk 34

    defaultConfig {
        applicationId "app.bimmerlink.mybmw"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "0.2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
